            async signUp(email, password) {
                const { data, error } = await supabaseClient.auth.signUp({ email, password });
                if (error) throw error;
                return data;
            },

                const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                return data;
            },
            async signOut() {
                const { error } = await supabaseClient.auth.signOut();
                if (error) throw error;
            },
            onAuthStateChanged(callback) {
                return supabaseClient.auth.onAuthStateChange((event, session) => {
                    callback(session?.user || null);
                });

        // ===== STORAGE SERVICE (Save/History) =====
        const StorageService = {
            async saveStudyMaterial(userId, data) {
                const { data: result, error } = await supabaseClient
                    .from('saved_materials')
                    .insert([{
                        user_id: userId,
                        subject: data.subject,
                        source_text: data.sourceText,
                        summary: data.summary,
                        flashcards: data.flashcards,
                        quiz: data.quiz
                    }])
                    .select();
                
                if (error) throw error;
                return result[0];
            },

                const { data, error } = await supabaseClient
                    .from('saved_materials')
                    .select('*')
                    .eq('user_id', userId)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                return data;
            },

                const { error } = await supabaseClient
                    .from('saved_materials')
                    .delete()

        // ===== ICONS =====

        };

        // ===== FILE PARSING SERVICE =====
        const FileService = {
            async parsePDF(file) {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += pageText + "\n";
                }
                return fullText;
            },

            async parseDOCX(file) {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer });
                return result.value;
            },

            async parseText(file) {
                return await file.text();
            },

            async parseFile(file) {
                const type = file.type;
                if (type === 'application/pdf') {
                    return await this.parsePDF(file);
                } else if (type === 'application/vnd.openxmlformats-officedocument.wordprocessingml.document') {
                    return await this.parseDOCX(file);
                } else if (type === 'text/plain') {
                    return await this.parseText(file);
                } else {
                    throw new Error("Unsupported file type");
                }
            }
        };

        // ===== AI SERVICE =====
        const AIService = {
            async generateStudyMaterial(text, subject, onStatusUpdate) {
                const BACKEND_URL = 'https://studybuddy-backend-bj4n.onrender.com/api/generate';

                try {
                    const msg = 'Connecting to AI server...';
                    if (onStatusUpdate) onStatusUpdate(msg);

                    const response = await fetch(BACKEND_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text: text,
                            subject: subject,
                            model: 'gemini-2.5-flash'
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        const msg = errorData.error || `HTTP ${response.status}`;
                        throw new Error(msg);
                    }

                    const data = await response.json();
                    return data;

                } catch (error) {
                    throw new Error(`Generation Failed: ${error.message}`);
                }
            }
        };

                    {Icon && <Icon className="w-5 h-5" />}
                    {children}

        // ===== AUTH MODAL =====
        const AuthModal = ({ isOpen, onClose, onAuthSuccess }) => {

                setError('');

                try {

                    setError(err.message);
                } finally {
                    setLoading(false);
                }

            if (!isOpen) return null;

            return (

                                <Icons.X className="w-6 h-6" />

                        <form onSubmit={handleSubmit} className="space-y-4">

                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}

                            {error && (
                                <div className="p-3 rounded-xl bg-red-50 dark:bg-red-900/20 text-red-600 text-sm">
                                    {error}
                                </div>
                            )}

                            <Button type="submit" disabled={loading} className="w-full">
                                {loading ? 'Please wait...' : (isSignUp ? 'Sign Up' : 'Sign In')}

                            <button

                                onClick={() => setIsSignUp(!isSignUp)}

        // ===== MAIN APP =====
        const App = () => {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [showAuthModal, setShowAuthModal] = useState(false);

                    setUser(user);
                    setLoading(false);
                    if (user) {
                        loadSavedMaterials(user.id);
                    }
                });

                return () => {
                    authListener?.subscription?.unsubscribe();

                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');

                    const materials = await StorageService.getSavedMaterials(userId);
                    setSavedMaterials(materials);

                await AuthService.signOut();
                setView('home');
                setSavedMaterials([]);
            };

                if (!user) {
                    setShowAuthModal(true);
                    return;

                try {
                    await StorageService.saveStudyMaterial(user.id, data);
                    await loadSavedMaterials(user.id);
                    alert('Saved successfully!');
                } catch (error) {
                    alert('Failed to save: ' + error.message);

            };

                    await StorageService.deleteSavedMaterial(user.id, materialId);

            if (loading) {

                                            <span className="hidden sm:inline">Sign Out</span>
                                        </button>
                                    </>
                                )}

                                {!user && (
                                    <Button variant="secondary" onClick={() => setShowAuthModal(true)}>

                    </header>

                        {view === 'home' && <HomeView onStart={() => setView('generate')} />}
                        {view === 'generate' && <GenerateView onComplete={(data) => { setGeneratedData(data); setView('results'); }} onSave={saveMaterial} user={user} />}
                        {view === 'results' && generatedData && <ResultsView data={generatedData} onSave={() => saveMaterial(generatedData)} onBack={() => setView('generate')} user={user} />}
                        {view === 'history' && <HistoryView materials={savedMaterials} onDelete={deleteMaterial} onView={(data) => { setGeneratedData(data); setView('results'); }} />}
                    </main>

                    <AuthModal isOpen={showAuthModal} onClose={() => setShowAuthModal(false)} onAuthSuccess={() => {}} />
                </div>
            );
        };

        // HOME VIEW
        const HomeView = ({ onStart }) => (
            <div className="text-center animate-fade-in">
                <h1 className="text-6xl font-extrabold mb-6">
                    <span className="bg-gradient-to-r from-primary-600 via-accent-600 to-pink-600 bg-clip-text text-transparent">
                        Transform Your Notes
                    </span>
                    <br />
                    <span className="bg-gradient-to-r from-accent-600 to-pink-600 bg-clip-text text-transparent">
                        Into Mastery
                    </span>
                </h1>
                <p className="text-xl text-slate-600 dark:text-slate-400 max-w-2xl mx-auto mb-8">
                    Upload study materials and let AI generate summaries, flashcards, and quizzes instantly.
                </p>
                <Button onClick={onStart} className="text-lg px-8 py-4">
                    <Icons.Sparkles className="w-6 h-6" />
                    Start Learning
                </Button>

                <div className="mt-20 grid md:grid-cols-3 gap-8">
                    {[
                        { icon: Icons.Brain, title: 'AI-Powered', desc: 'Advanced AI understands your content' },
                        { icon: Icons.Sparkles, title: 'Instant Results', desc: 'Generate in seconds' },
                        { icon: Icons.Save, title: 'Save & Review', desc: 'Access anytime' }
                    ].map((f, i) => (
                        <Card key={i} className="p-8 text-center hover:scale-105 transition-transform">
                            <f.icon className="w-12 h-12 mx-auto mb-4 text-primary-600" />
                            <h3 className="text-xl font-bold mb-2">{f.title}</h3>
                            <p className="text-slate-600 dark:text-slate-400">{f.desc}</p>
                        </Card>
                    ))}
                </div>
            </div>
        );

        // GENERATE VIEW
        const GenerateView = ({ onComplete }) => {
            const [text, setText] = useState('');
            const [subject, setSubject] = useState('');
            const [loading, setLoading] = useState(false);
            const [status, setStatus] = useState('');
            const fileInputRef = useRef(null);

            const handleFileChange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    setStatus('Reading file...');
                    const content = await FileService.parseFile(file);
                    setText(content);
                    setStatus('');
                } catch (error) {
                    alert('Error: ' + error.message);
                    setStatus('');
                }
            };

            const handleGenerate = async () => {
                if (!text || !subject) {
                    alert('Please enter both text and subject');
                    return;
                }

                setLoading(true);
                try {
                    const result = await AIService.generateStudyMaterial(text, subject, setStatus);
                    result.sourceText = text;
                    result.subject = subject;
                    onComplete(result);
                } catch (error) {
                    alert(error.message);
                } finally {
                    setLoading(false);
                }
            };

            if (loading) {
                return (
                    <div className="max-w-2xl mx-auto text-center py-20">
                        <div className="animate-spin rounded-full h-16 w-16 border-t-2 border-b-2 border-primary-600 mx-auto mb-6"></div>
                        <h3 className="text-2xl font-bold mb-2">Analyzing...</h3>
                        <p className="text-slate-600 dark:text-slate-400">{status}</p>
                    </div>
                );
            }

            return (
                <div className="max-w-4xl mx-auto animate-slide-up">
                    <h2 className="text-3xl font-bold mb-8 text-center">Generate Study Materials</h2>

                    <Card className="p-8 space-y-6">
                        <div>
                            <label className="block text-sm font-medium mb-2">Paste notes or upload file</label>
                            <textarea
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                placeholder="Paste your study material..."
                                className="w-full h-64 px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-primary-500 resize-none"
                            />
                            <input
                                type="file"
                                ref={fileInputRef}
                                onChange={handleFileChange}
                                accept=".pdf,.docx,.txt"
                                className="hidden"
                            />
                            <Button variant="secondary" onClick={() => fileInputRef.current?.click()} className="mt-4">
                                <Icons.Upload className="w-5 h-5" />
                                Upload File
                            </Button>
                        </div>

                        <div>
                            <label className="block text-sm font-medium mb-2">Subject</label>
                            <input
                                type="text"
                                value={subject}
                                onChange={(e) => setSubject(e.target.value)}
                                placeholder="e.g., Biology, History..."
                                className="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-primary-500"
                            />
                        </div>

                        <Button onClick={handleGenerate} disabled={!text || !subject} className="w-full text-lg py-4">
                            <Icons.Sparkles className="w-6 h-6" />
                            Generate
                        </Button>
                    </Card>
                </div>
            );
        };

        // RESULTS VIEW
        const ResultsView = ({ data, onSave, onBack, user }) => {
            const [activeTab, setActiveTab] = useState('summary');

            return (
                <div className="animate-fade-in">
                    <div className="flex justify-between mb-8">
                        <h2 className="text-3xl font-bold">Your Study Materials</h2>
                        <div className="flex gap-4">
                            {user && (
                                <Button variant="secondary" onClick={onSave}>
                                    <Icons.Save className="w-5 h-5" />
                                    Save
                                </Button>
                            )}
                            <Button variant="ghost" onClick={onBack}>← Back</Button>
                        </div>
                    </div>

                    <div className="flex justify-center mb-8">
                        <div className="bg-slate-100 dark:bg-slate-800 p-1 rounded-xl inline-flex">
                            {[
                                { id: 'summary', label: 'Summary', icon: Icons.Layers },
                                { id: 'flashcards', label: 'Flashcards', icon: Icons.RotateCcw },
                                { id: 'quiz', label: 'Quiz', icon: Icons.BookOpen }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-2 px-6 py-3 rounded-lg font-medium ${
                                        activeTab === tab.id ? 'bg-white dark:bg-slate-700 text-primary-700 shadow-md' : 'text-slate-600'
                                    }`}
                                >
                                    <tab.icon className="w-5 h-5" />
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="max-w-4xl mx-auto">
                        {activeTab === 'summary' && data.summary && (
                            <Card className="p-8">
                                <h3 className="text-2xl font-bold mb-6">Summary</h3>
                                {data.summary.bullets && (
                                    <div className="mb-6">
                                        <h4 className="font-semibold text-lg mb-3">Key Points</h4>
                                        <ul className="list-disc list-inside space-y-2">
                                            {data.summary.bullets.map((b, i) => <li key={i}>{b}</li>)}
                                        </ul>
                                    </div>
                                )}
                                {data.summary.keyConcepts && (
                                    <div>
                                        <h4 className="font-semibold text-lg mb-3">Key Concepts</h4>
                                        <div className="space-y-3">
                                            {data.summary.keyConcepts.map((c, i) => (
                                                <div key={i} className="bg-primary-50 dark:bg-primary-900/20 p-4 rounded-xl">
                                                    <strong className="text-primary-700">{c.term}:</strong> {c.def}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </Card>
                        )}

                        {activeTab === 'flashcards' && data.flashcards && (
                            <div className="grid md:grid-cols-2 gap-6">
                                {data.flashcards.map((card, i) => <Flashcard key={i} card={card} />)}
                            </div>
                        )}

                        {activeTab === 'quiz' && data.quiz && <Quiz questions={data.quiz} />}
                    </div>
                </div>
            );
        };

        // FLASHCARD
        const Flashcard = ({ card }) => {
            const [flipped, setFlipped] = useState(false);

            return (
                <div className="perspective-1000 h-64 cursor-pointer" onClick={() => setFlipped(!flipped)}>
                    <div className={`relative w-full h-full transition-transform duration-500 transform-style-3d ${flipped ? 'rotate-y-180' : ''}`}>
                        <Card className="absolute w-full h-full p-8 flex flex-col justify-center items-center text-center backface-hidden">
                            <p className="text-lg font-medium">{card.front}</p>
                            <p className="text-sm text-slate-500 mt-4">Click to flip</p>
                        </Card>

                        <Card className="absolute w-full h-full p-8 flex flex-col justify-center items-center text-center backface-hidden rotate-y-180 bg-gradient-to-br from-primary-50 to-accent-50 dark:from-primary-900/20 dark:to-accent-900/20">
                            <p className="text-lg">{card.back}</p>
                            <span className={`mt-4 px-3 py-1 rounded-full text-xs font-semibold ${
                                card.difficulty === 'easy' ? 'bg-green-100 text-green-800' :
                                card.difficulty === 'medium' ? 'bg-yellow-100 text-yellow-800' :
                                'bg-red-100 text-red-800'
                            }`}>
                                {card.difficulty}
                            </span>
                        </Card>
                    </div>
                </div>
            );
        };

        // QUIZ
        const Quiz = ({ questions }) => {
            const [answers, setAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);

            const calculateScore = () => {
                let correct = 0;
                questions.forEach(q => {
                    if (answers[q.id] === q.answer) correct++;
                });
                return correct;
            };

            if (showResults) {
                const score = calculateScore();
                const pct = Math.round((score / questions.length) * 100);

                return (
                    <Card className="p-8 text-center">
                        <h3 className="text-3xl font-bold mb-4">Quiz Complete!</h3>
                        <div className="text-6xl font-bold mb-4 bg-gradient-to-r from-primary-600 to-accent-600 bg-clip-text text-transparent">
                            {pct}%
                        </div>
                        <p className="text-xl mb-8">You got {score} out of {questions.length} correct</p>
                        <Button onClick={() => { setShowResults(false); setAnswers({}); }}>Try Again</Button>
                    </Card>
                );
            }

            return (
                <div className="space-y-6">
                    {questions.map((q, i) => (
                        <Card key={q.id} className="p-6">
                            <h4 className="text-lg font-medium mb-4">
                                <span className="text-slate-400 mr-2">{i + 1}.</span>
                                {q.question}
                            </h4>
                            <div className="space-y-2">
                                {q.options?.map(opt => (
                                    <button
                                        key={opt}
                                        onClick={() => setAnswers({ ...answers, [q.id]: opt })}
                                        className={`w-full text-left p-4 rounded-xl border-2 transition-all ${
                                            answers[q.id] === opt
                                                ? 'bg-primary-50 dark:bg-primary-900/20 border-primary-500'
                                                : 'border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-800'
                                        }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                        </Card>
                    ))}
                    <Button onClick={() => setShowResults(true)} disabled={Object.keys(answers).length < questions.length} className="w-full">
                        Submit Quiz
                    </Button>
                </div>
            );
        };

        // HISTORY VIEW
        const HistoryView = ({ materials, onDelete, onView }) => {
            if (materials.length === 0) {
                return (
                    <div className="text-center py-20">
                        <Icons.History className="w-20 h-20 mx-auto mb-6 text-slate-300" />
                        <h3 className="text-2xl font-bold mb-2">No Saved Materials Yet</h3>
                        <p className="text-slate-600">Generate and save to see them here!</p>
                    </div>
                );
            }

            return (
                <div className="animate-fade-in">
                    <h2 className="text-3xl font-bold mb-8">Your Saved Materials</h2>
                    <div className="grid md:grid-cols-2 gap-6">
                        {materials.map(m => (
                            <Card key={m.id} className="p-6">
                                <div className="flex justify-between mb-4">
                                    <div>
                                        <h3 className="text-xl font-bold mb-2">{m.subject}</h3>
                                        <p className="text-sm text-slate-500">
                                            {new Date(m.created_at).toLocaleDateString()}
                                        </p>
                                    </div>
                                    <button onClick={() => onDelete(m.id)} className="text-red-500 hover:text-red-700 p-2">
                                        <Icons.Trash className="w-5 h-5" />
                                    </button>
                                </div>
                                <p className="text-slate-600 mb-4 line-clamp-3">{m.source_text?.substring(0, 150)}...</p>
                                <Button variant="secondary" onClick={() => onView(m)} className="w-full">
                                    View Materials
                                </Button>
                            </Card>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
